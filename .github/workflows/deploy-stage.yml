name: Deploy AI stage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acropora-ai-stage-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ACROPORA_AI_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ACROPORA_AI_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload source
        env:
          DEPLOY_USER: ${{ secrets.ACROPORA_AI_USER }}
          DEPLOY_HOST: ${{ secrets.ACROPORA_AI_HOST }}
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='data/' \
            --exclude='backups/' \
            --exclude='logs/' \
            --exclude='.git/' \
            -e "ssh -o BatchMode=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/acropora-ai/app/"

      - name: Deploy containers
        env:
          DEPLOY_USER: ${{ secrets.ACROPORA_AI_USER }}
          DEPLOY_HOST: ${{ secrets.ACROPORA_AI_HOST }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "ACROPORA_AI_COMMIT=$DEPLOY_COMMIT bash -se" <<'REMOTE'
          set -euo pipefail

          cd /opt/acropora-ai/app

          # The sha travels into the container, so /health can say which code
          # is answering. Without it the only evidence about the running code
          # is that this workflow went green - which is a fact about the
          # workflow, not about the process serving requests.
          export ACROPORA_AI_COMMIT

          docker compose \
            --env-file .env \
            -f infra/docker-compose.yml \
            up -d --build --force-recreate api caddy

                    for attempt in $(seq 1 30); do
            if curl -4 -fsS https://ai-stage.acropora.hu/health; then
              exit 0
            fi

            sleep 2
          done

          echo "Health check failed after 60 seconds"
          exit 1
          REMOTE
