name: Deploy AI stage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acropora-ai-stage-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ACROPORA_AI_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ACROPORA_AI_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload source
        env:
          DEPLOY_USER: ${{ secrets.ACROPORA_AI_USER }}
          DEPLOY_HOST: ${{ secrets.ACROPORA_AI_HOST }}
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='data/' \
            --exclude='backups/' \
            --exclude='logs/' \
            --exclude='.git/' \
            -e "ssh -o BatchMode=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/acropora-ai/app/"

      - name: Deploy containers
        env:
          DEPLOY_USER: ${{ secrets.ACROPORA_AI_USER }}
          DEPLOY_HOST: ${{ secrets.ACROPORA_AI_HOST }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "ACROPORA_AI_COMMIT=$DEPLOY_COMMIT bash -se" <<'REMOTE'
          set -euo pipefail

          cd /opt/acropora-ai/app

          # The sha travels into the container, so /health can say which code
          # is answering. Without it the only evidence about the running code
          # is that this workflow went green - which is a fact about the
          # workflow, not about the process serving requests.
          export ACROPORA_AI_COMMIT

          # And a second fact the sha cannot carry: which IMAGE of that commit.
          # The same commit built twice can differ - one build pulls a patched
          # system package, the next one hits a cached layer and keeps the old
          # one - and `version` reads identically in both. Stamped here, one
          # step before the build that consumes it as a build argument.
          ACROPORA_AI_BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export ACROPORA_AI_BUILT_AT

          # ONLY THE API. Caddy is no longer a service in this compose file --
          # Traefik holds 80 and 443 now, and naming a service that is not
          # there would fail the whole command, taking the API down with it.
          #
          # SO THIS WORKFLOW NO LONGER RESTORES THE FRONT DOOR, only the
          # application behind it. That is deliberate, and it is the half a
          # reader would walk past: bringing the front door back is a separate,
          # manual step (`docker start infra-caddy-1`), and it has to be
          # preceded by stopping the Coolify-side proxy, or both will want the
          # same two ports.
          #
          # The container is still there to start: measured on the host,
          # `infra-caddy-1` sits in Exited (0) - stopped on purpose, not
          # crashed. `up -d api` does not remove it, because this command
          # carries neither --remove-orphans nor a preceding `compose down`.
          docker compose \
            --env-file .env \
            -f infra/docker-compose.yml \
            up -d --build --force-recreate api

          # The check runs ON THIS MACHINE, against the loopback address the api
          # container binds - not against the public name.
          #
          # It used to call https://ai-stage.acropora.hu/health, which goes out to
          # DNS, back through Caddy, and only then reaches the container. That
          # works today and will stop working the moment the API moves behind a
          # private network: the deploy would fail, sixty seconds later, and the
          # failure would look like the network change had broken the deploy.
          # It would not have. The check would simply be looking in from outside.
          #
          # What this trades away, said out loud: the old call also proved that
          # Caddy was serving the site publicly. This one does not. That
          # assertion is going away on purpose - the API is meant to stop being
          # publicly reachable - so keeping a check that depends on it would mean
          # keeping a check we intend to break.
          #
          # -4 because the container publishes on 127.0.0.1, not on ::1.
          for attempt in $(seq 1 30); do
            if curl -4 -fsS http://127.0.0.1:3000/health; then
              exit 0
            fi

            sleep 2
          done

          echo "Health check failed after 60 seconds"
          exit 1
          REMOTE
