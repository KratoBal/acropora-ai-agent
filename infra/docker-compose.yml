services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    networks:
      - ai-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ../data/redis:/data
    networks:
      - ai-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN}
      ACROPORA_OS_BASE_URL: ${ACROPORA_OS_BASE_URL}
      ACROPORA_OS_AI_SERVICE_TOKEN: ${ACROPORA_OS_AI_SERVICE_TOKEN}
      ACROPORA_AI_OPENAI_TIMEOUT_MS: ${ACROPORA_AI_OPENAI_TIMEOUT_MS}
      ACROPORA_AI_OPENAI_MAX_RETRIES: ${ACROPORA_AI_OPENAI_MAX_RETRIES}
      ACROPORA_AI_CONNECTION_TIMEOUT_MS: ${ACROPORA_AI_CONNECTION_TIMEOUT_MS}
      # Which commit this container was built from. Set by the deploy
      # workflow; empty for anything started another way, and the health
      # endpoint then answers "unknown" rather than guessing.
      ACROPORA_AI_COMMIT: ${ACROPORA_AI_COMMIT:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../data/caddy:/data
      - ../data/caddy_config:/config
    depends_on:
      api:
        condition: service_started
    networks:
      - ai-internal
networks:
  ai-internal:
    driver: bridge
