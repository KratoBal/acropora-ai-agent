services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    networks:
      - ai-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ../data/redis:/data
    networks:
      - ai-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # THIS SERVICE STAYS FOR NOW, AND THAT IS DELIBERATE.
  #
  # Coolify builds and runs the API from the same Dockerfile from now on, which
  # makes this block redundant -- but only ONCE the Coolify one is proven to
  # answer. Removing it in the same step would mean that if the new path does
  # not come up, there is no AI service at all and nothing to fall back to.
  #
  # WHEN TO DELETE IT: after the Coolify container has served a real request and
  # its /health reports the expected commit. Then this block and its port
  # binding go, in one commit. Until then two copies may run side by side; they
  # are stateless and share the same database, so that is untidy rather than
  # dangerous -- 127.0.0.1:3000 here, its own port over there.
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Stamped into the image, not into the container. See the Dockerfile
        # for why the difference matters.
        ACROPORA_AI_BUILT_AT: ${ACROPORA_AI_BUILT_AT:-}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN}
      ACROPORA_OS_BASE_URL: ${ACROPORA_OS_BASE_URL}
      ACROPORA_OS_AI_SERVICE_TOKEN: ${ACROPORA_OS_AI_SERVICE_TOKEN}
      ACROPORA_AI_OPENAI_TIMEOUT_MS: ${ACROPORA_AI_OPENAI_TIMEOUT_MS}
      ACROPORA_AI_OPENAI_MAX_RETRIES: ${ACROPORA_AI_OPENAI_MAX_RETRIES}
      ACROPORA_AI_CONNECTION_TIMEOUT_MS: ${ACROPORA_AI_CONNECTION_TIMEOUT_MS}
      # Which commit this container was built from. Set by the deploy
      # workflow; empty for anything started another way, and the health
      # endpoint then answers "unknown" rather than guessing.
      ACROPORA_AI_COMMIT: ${ACROPORA_AI_COMMIT:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-internal

# THE FRONT DOOR MOVED TO TRAEFIK (Coolify), 2026-09-01.
#
# The caddy service used to live here and hold 80 and 443. Only one process can
# hold those, so it had to go in the SAME step that brings Traefik up -- not
# before (nothing would answer) and not after (the ports would already be taken).
#
# infra/caddy/Caddyfile IS KEPT ON PURPOSE, even though nothing here mounts it
# any more. It is the record of what this machine served: five names, four of
# them nothing to do with the AI service (staging, api-staging, commerce-stage,
# and Coolify's own coolify2). Whoever configures Traefik needs that list, and a
# deleted file would send them looking through git history for it.
#
# AND THE ONE THAT BITES: coolify2.acropora.hu is Coolify's OWN interface. When
# Caddy stops, the tool being used to do the move disappears with it. Coolify
# also answers directly on host port 8000 -- open that BEFORE stopping Caddy,
# because afterwards there is nothing left to open it with.

networks:
  ai-internal:
    driver: bridge
